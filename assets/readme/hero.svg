<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="FitRPG — fitness workouts that power RPG combat">
  <title>FitRPG — Real reps. Real damage.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A0F"/>
      <stop offset="55%" stop-color="#14121A"/>
      <stop offset="100%" stop-color="#1A1210"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A54B"/>
      <stop offset="100%" stop-color="#C93C3C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1A24"/>
      <stop offset="100%" stop-color="#121018"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#C93C3C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0B0A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="18"/>
  <rect width="1200" height="420" fill="url(#glow)" rx="18"/>

  <!-- faint grid -->
  <g stroke="#2A2533" stroke-width="1" opacity="0.45">
    <path d="M40 80 H560"/><path d="M40 140 H480"/><path d="M40 200 H520"/>
    <path d="M40 260 H440"/><path d="M40 320 H500"/>
  </g>

  <!-- category -->
  <text x="56" y="78" fill="#9A8F7A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3">IOS FITNESS RPG</text>

  <!-- title -->
  <text x="56" y="168" fill="#F4EDE4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">FitRPG</text>

  <!-- rule -->
  <rect x="56" y="188" width="120" height="4" rx="2" fill="url(#ember)"/>

  <!-- value line -->
  <text x="56" y="236" fill="#D8CFC2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Real reps. Real damage.</text>
  <text x="56" y="274" fill="#8E867A" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20">Camera counts your workouts. Arena, clans, and bosses do the rest.</text>

  <!-- pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#F4EDE4">
    <rect x="56" y="312" width="118" height="34" rx="8" fill="#1E1A24" stroke="#3A3228"/>
    <text x="74" y="334">Free · No IAP</text>
    <rect x="186" y="312" width="132" height="34" rx="8" fill="#1E1A24" stroke="#3A3228"/>
    <text x="204" y="334">Health &amp; Fitness</text>
    <rect x="330" y="312" width="108" height="34" rx="8" fill="#1E1A24" stroke="#3A3228"/>
    <text x="348" y="334">SwiftUI</text>
  </g>

  <!-- right artifact: stylized phone + XP bar -->
  <g transform="translate(740,48)">
    <rect x="0" y="0" width="380" height="324" rx="22" fill="url(#panel)" stroke="#3A3228" stroke-width="2"/>
    <rect x="24" y="28" width="332" height="200" rx="14" fill="#0B0A0F" stroke="#2A2533"/>
    <!-- silhouette figure -->
    <circle cx="190" cy="88" r="22" fill="#2A2533"/>
    <path d="M158 128 C158 110 222 110 222 128 L228 188 L152 188 Z" fill="#2A2533"/>
    <path d="M152 140 L128 168 M228 140 L252 168" stroke="#E8A54B" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <!-- XP -->
    <text x="40" y="258" fill="#9A8F7A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">ENERGY</text>
    <rect x="40" y="270" width="300" height="14" rx="7" fill="#0B0A0F" stroke="#3A3228"/>
    <rect x="40" y="270" width="210" height="14" rx="7" fill="url(#ember)"/>
    <text x="40" y="310" fill="#E8A54B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">+12 XP  ·  Squat set logged</text>
  </g>
</svg>
