<title>FitRPG — Legal</title>
<style>
:root { color-scheme: light dark; --ink:#1c1c1e; --bg:#f7f4ef; --accent:#b45309; --muted:#6b7280; --card:#fff; --line:rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) {
  :root { --ink:#f3f0ea; --bg:#12141a; --accent:#f59e0b; --muted:#9ca3af; --card:#1c1f28; --line:rgba(255,255,255,.12); }

a.block { display:block; font-weight:600; margin:.35rem 0; text-decoration:none; color:inherit; }
